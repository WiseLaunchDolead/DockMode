name: DockMode
options:
  bundleIdPrefix: fr.wiselaunch
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  developmentLanguage: en
  knownRegions: [en, fr, Base]

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

packages:
  DockModeCorePackage:
    path: .
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6

targets:
  DockMode:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: DockModeCorePackage
        product: DockModeCore
      - package: Sparkle
        product: Sparkle
      - target: DockModeFocusExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.wiselaunch.DockMode
        PRODUCT_NAME: DockMode
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/DockMode.entitlements
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        ARCHS: $(ARCHS_STANDARD)
        ONLY_ACTIVE_ARCH: NO
        PROVISIONING_PROFILE_SPECIFIER: $(DOCKMODE_APP_PROFILE)
        SWIFT_STRICT_CONCURRENCY: targeted

  DockModeFocusExtension:
    type: com.apple.product-type.extensionkit-extension
    platform: macOS
    sources:
      - path: FocusExtension
    dependencies:
      - package: DockModeCorePackage
        product: DockModeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.wiselaunch.DockMode.FocusExtension
        PRODUCT_NAME: DockModeFocusExtension
        INFOPLIST_FILE: FocusExtension/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_ENTITLEMENTS: FocusExtension/DockModeFocusExtension.entitlements
        SKIP_INSTALL: YES
        PROVISIONING_PROFILE_SPECIFIER: $(DOCKMODE_FOCUS_PROFILE)
        SWIFT_STRICT_CONCURRENCY: targeted

  DockModeCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/DockModeCoreTests
    dependencies:
      - package: DockModeCorePackage
        product: DockModeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.wiselaunch.DockModeCoreTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO

schemes:
  DockMode:
    build:
      targets:
        DockMode: all
        DockModeFocusExtension: all
        DockModeCoreTests: [test]
    test:
      targets:
        - DockModeCoreTests
      gatherCoverageData: true
    run:
      config: Debug
    archive:
      config: Release
