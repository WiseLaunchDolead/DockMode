name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Run isolated core checks
        run: swift run DockModeCoreChecks

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project DockMode.xcodeproj -scheme DockMode

      - name: Run unit tests
        run: |
          for arch in arm64 x86_64; do
            xcodebuild test \
              -project DockMode.xcodeproj \
              -scheme DockMode \
              -destination "platform=macOS,arch=$arch" \
              ARCHS="$arch" \
              ONLY_ACTIVE_ARCH=YES \
              CODE_SIGNING_ALLOWED=NO
          done

      - name: Build unsigned universal app
        run: |
          xcodebuild build \
            -project DockMode.xcodeproj \
            -scheme DockMode \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build/DerivedData

      - name: Create and verify DMG layout
        run: |
          mkdir -p build/Release
          ditto build/DerivedData/Build/Products/Release/DockMode.app build/Release/DockMode.app
          scripts/create-dmg.sh build/Release/DockMode.app build/DockMode-ci.dmg
          scripts/verify-dmg-layout.sh build/DockMode-ci.dmg
