name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Run isolated core checks
        run: swift run DockModeCoreChecks

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project DockMode.xcodeproj -scheme DockMode

      - name: Run unit tests (arm64 and Intel)
        run: |
          for arch in arm64 x86_64; do
            xcodebuild test \
              -project DockMode.xcodeproj \
              -scheme DockMode \
              -destination "platform=macOS,arch=$arch" \
              ARCHS="$arch" \
              ONLY_ACTIVE_ARCH=YES \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO
          done

      - name: Build unsigned universal application
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          xcodebuild build \
            -project DockMode.xcodeproj \
            -scheme DockMode \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            -derivedDataPath "$RUNNER_TEMP/DockModeDerivedData"

      - name: Create and verify DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP_PATH="$RUNNER_TEMP/DockModeDerivedData/Build/Products/Release/DockMode.app"
          DMG_PATH="$RUNNER_TEMP/DockMode-${VERSION}.dmg"
          scripts/create-dmg.sh "$APP_PATH" "$DMG_PATH"
          scripts/verify-dmg-layout.sh "$DMG_PATH"
          shasum -a 256 "$DMG_PATH" > "$RUNNER_TEMP/DockMode-${VERSION}.dmg.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/DockMode-${VERSION}.dmg" \
            "$RUNNER_TEMP/DockMode-${VERSION}.dmg.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "DockMode ${VERSION}" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag
